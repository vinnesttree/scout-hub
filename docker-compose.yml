services:
  scouthub:
    build: .
    image: scout-hub:local
    container_name: scout-hub
    ports:
      - "8000:8000"
    volumes:
      # App database + scratch. Keep this on fast local storage.
      - ./data:/data
      # >>> CHANGE THE LEFT SIDE <<<
      # Point this at wherever recordings and match clips should be archived
      # (a NAS share, a big disk, etc). It is mounted at /media in the container,
      # and the in-app folder picker browses inside it.
      - ./media:/media
    environment:
      SCOUTHUB_ARCHIVE_ROOT: /media
      SCOUTHUB_DATA_DIR: /data
      # Optional: seed the RobotEvents token here instead of the Settings page.
      # SCOUTHUB_ROBOTEVENTS_TOKEN: "your-token"
      # Optional: create an admin account at startup (otherwise /login offers a
      # one-time "create the first admin" form while no accounts exist).
      # SCOUTHUB_ADMIN_USERNAME: "admin"
      # SCOUTHUB_ADMIN_PASSWORD: "change-me-please"
      # Set to "true" when serving over HTTPS.
      # SCOUTHUB_COOKIE_SECURE: "false"
    restart: unless-stopped
